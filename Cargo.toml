[package]
name = "chess"
version = "1.0.0"
edition = "2024"
description = "A high-quality terminal chess client with a native Rust engine"
license = "BUSL-1.1"
repository = "https://github.com/kpihx-labs/chess"
keywords = ["chess", "game", "terminal", "engine"]
categories = ["command-line-utilities", "games"]

[dependencies]
chrono = "0.4"
crossterm = "0.29"
dirs = "6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vendetta-chess-engine = "1.1.2"
